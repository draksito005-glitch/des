<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapLoad - Descargador de Videos Todo en Uno</title>
    <style>
        /* Estilos generales y tipografía moderna */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a; /* Fondo oscuro moderno */
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Barra de navegación superior */
        header {
            background-color: #1e293b;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            color: #38bdf8; /* Azul brillante */
        }

        /* Contenedor principal de la web */
        .main-wrapper {
            display: flex;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            gap: 20px;
        }

        /* Columna central de la herramienta */
        .content-area {
            flex: 1;
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .content-area h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .content-area p {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* Caja de descarga (Barra + Botón) */
        .download-box {
            display: flex;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 50px;
            padding: 6px;
            margin-bottom: 30px;
            transition: border-color 0.3s;
        }
        .download-box:focus-within {
            border-color: #38bdf8;
        }
        .download-box input {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 20px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .download-box input::placeholder {
            color: #64748b;
        }
        .download-box button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .download-box button:hover {
            background-color: #0ea5e9;
        }

        /* Indicador de plataformas compatibles */
        .supported-apps {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .app-badge {
            background-color: #334155;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
        }

        /* Columnas de Publicidad Lateral Limpia */
        .ads-sidebar {
            width: 160px;
            background-color: #1e293b;
            border: 1px dashed #475569;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 12px;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Ocultar anuncios en pantallas muy chicas (Celulares) */
        @media (max-width: 768px) {
            .main-wrapper { flex-direction: column; }
            .ads-sidebar { width: 100%; height: 90px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>SnapLoad Pro</h1>
    </header>

    <div class="main-wrapper">
        <!-- Bloque publicitario izquierdo -->
        <div class="ads-sidebar">
            Espacio Publicitario Lateral (Ej. AdSense 160x600)
        </div>

        <!-- Área de la herramienta -->
        <main class="content-area">
            <h2>Descargador de Videos Online</h2>
            <p>Pega el enlace de cualquier red social para descargar tu video en Alta Definición.</p>

            <div class="download-box">
                <input type="text" placeholder="Inserta el link de TikTok, Instagram, YouTube, Facebook..." id="videoUrl">
                <button type="button" onclick="simularDescarga()">Descargar</button>
            </div>

            <p style="font-size: 14px; margin-bottom: 10px; color: #64748b;">Compatible con:</p>
            <div class="supported-apps">
                <span class="app-badge" style="border-left: 3px solid #ff0050;">TikTok</span>
                <span class="app-badge" style="border-left: 3px solid #e1306c;">Instagram</span>
                <span class="app-badge" style="border-left: 3px solid #ff0000;">YouTube</span>
                <span class="app-badge" style="border-left: 3px solid #1877f2;">Facebook</span>
                <span class="app-badge" style="border-left: 3px solid #1da1f2;">Twitter / X</span>
            </div>
        </main>

        <!-- Bloque publicitario derecho -->
        <div class="ads-sidebar">
            Espacio Publicitario Lateral (Ej. AdSense 160x600)
        </div>
    </div>

<script>
    async function simularDescarga() {
        const urlInput = document.getElementById('videoUrl').value;
        
        if (urlInput.trim() === "") {
            alert("Por favor, pega un enlace de Instagram primero.");
            return;
        }

        // Cambiamos el texto del botón para avisar al usuario
        const boton = document.querySelector('.download-box button');
        boton.innerText = "Procesando...";
        boton.disabled = true;

        // CONFIGURACIÓN REAL CON TUS CREDENCIALES
        const urlApi = 'https://rapidapi.com'; 
        const apiKey = '30e40aa3c1mshc15c52b017ed439p1e1ad0jsnb3b33a59bf1b';
        const apiHost = '://rapidapi.com';

        try {
            // Hacemos la consulta al servidor de la API pasando la URL de Instagram
            const response = await fetch(`${urlApi}?url=${encodeURIComponent(urlInput)}`, {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': apiKey,
                    'x-rapidapi-host': apiHost
                }
            });

            const data = await response.json();
            console.log("Respuesta de la API:", data);
            
            // Evaluamos las respuestas comunes de esta API para abrir el video directo
            if (data && (data.media || data.downloadUrl || data.url)) {
                const videoLink = data.media || data.downloadUrl || data.url;
                
                alert("¡Video encontrado con éxito! Se abrirá en una nueva pestaña para que lo guardes.");
                window.open(videoLink, '_blank'); 
            } else {
                alert("No se pudo extraer el video. Asegúrate de que la cuenta de Instagram sea pública y el enlace sea correcto.");
            }

        } catch (error) {
            console.error("Error al conectar con el motor:", error);
            alert("Hubo un problema al conectar con el servidor de descargas.");
        } finally {
            // Restauramos el botón original
            boton.innerText = "Descargar";
            boton.disabled = false;
        }
    }
</script>
 

</body>
</html>
