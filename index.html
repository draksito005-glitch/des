<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Universal Ilimitado</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; color: #4f46e5; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input {
            padding: 12px; width: 100%; border: 2px solid #ddd;
            border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 16px;
        }
        button {
            background-color: #4f46e5; color: white; padding: 12px; border: none;
            border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #3730a3; }
        .mensaje { margin-top: 15px; font-size: 14px; font-weight: bold; color: #4f46e5; word-break: break-all; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Descargador Todo-en-Uno</h1>
        <p>YouTube, TikTok, Instagram, Twitter y más</p>
        
        <input type="text" id="urlInput" placeholder="Pega el enlace de cualquier video aquí...">
        
        <div style="margin-bottom: 20px;">
            <label style="margin-right: 15px;"><input type="radio" name="format" value="classic" checked> Video (MP4)</label>
            <label><input type="radio" name="format" value="audio"> Audio (MP3)</label>
        </div>

        <button onclick="procesarEnlace()">Descargar Ahora</button>
        
        <div id="mensaje" class="mensaje"></div>
    </div>

    <script>
        async function procesarEnlace() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const mensaje = document.getElementById('mensaje');
            const tipo = document.querySelector('input[name="format"]:checked').value;
            
            if (!urlInput) {
                mensaje.innerText = "❌ Por favor, pega un enlace válido.";
                return;
            }

            mensaje.innerText = "⏳ Procesando el enlace en el servidor abierto... Espera un momento.";

            // Configuración directa para el servidor abierto de Cobalt, libre de CORS y de claves
            const opciones = {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: urlInput,
                    downloadMode: tipo, // Cambia automáticamente entre audio o video
                    videoQuality: '720'
                })
            };

            try {
                // Llamamos a la API abierta y pública
                const response = await fetch('https://cobalt.tools', opciones);
                const data = await response.json();

                // Si el servidor nos devuelve el archivo procesado con éxito
                if (data && data.url) {
                    mensaje.innerText = "✅ ¡Listo! Tu descarga comenzará en unos segundos.";
                    // Abre el archivo multimedia directo para guardarlo
                    window.open(data.url, '_blank');
                } else if (data && data.text) {
                    mensaje.innerText = "❌ El servidor dice: " + data.text;
                } else {
                    mensaje.innerText = "❌ No se pudo procesar este enlace. Intenta con otro video.";
                }
            } catch (error) {
                console.error(error);
                mensaje.innerText = "❌ Error de conexión. El servidor público de descargas está ocupado, intenta de nuevo.";
            }
        }
    </script>
</body>
</html>
