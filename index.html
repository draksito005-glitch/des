<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador Multiplataforma</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { margin-bottom: 10px; color: #11998e; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input {
            padding: 12px; width: 100%; border: 2px solid #ddd;
            border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; font-size: 16px;
        }
        button {
            background-color: #11998e; color: white; padding: 12px; border: none;
            border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background-color: #0b7970; }
        .resultado-box {
            margin-top: 25px; padding: 15px; background: #f9f9f9; 
            border-radius: 10px; border: 1px dashed #11998e; display: none;
        }
        .btn-download {
            display: block; background-color: #28a745; color: white; padding: 10px;
            text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px;
        }
        .btn-download:hover { background-color: #218838; }
        .mensaje { margin-top: 15px; font-size: 14px; font-weight: bold; color: #0b7970; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Descargador Todo-en-Uno</h1>
        <p>YouTube, TikTok, Instagram, Twitter y más</p>
        
        <input type="text" id="urlInput" placeholder="Pega el enlace completo aquí...">
        <button onclick="procesarEnlace()">Analizar Enlace</button>
        
        <div id="resultado" class="resultado-box">
            <span id="videoTitulo" style="font-weight: bold; font-size: 15px;">Elemento encontrado</span>
            <a id="btnDescarga" class="btn-download" target="_blank" rel="noopener noreferrer">Descargar Archivo</a>
        </div>
        
        <div id="mensaje" class="mensaje"></div>
    </div>

    <script>
        async function procesarEnlace() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const mensaje = document.getElementById('mensaje');
            const resultadoBox = document.getElementById('resultado');
            const btnDescarga = document.getElementById('btnDescarga');
            const videoTitulo = document.getElementById('videoTitulo');
            
            if (!urlInput) {
                mensaje.innerText = "❌ Por favor, pega un enlace válido.";
                return;
            }

            mensaje.innerText = "⏳ El servidor externo está buscando el video... Espera un momento.";
            resultadoBox.style.display = "none";

            // Usamos tu misma clave de RapidAPI pero conectando a la nueva API directa
            const apiTarget = `https://rapidapi.com{encodeURIComponent(urlInput)}`;
            
            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': '30e40aa3c1mshc15c52b017ed439p1e1ad0jsnb3b33a59bf1b',
                    'x-rapidapi-host': 'social-media-video-downloader.p.rapidapi.com'
                }
            };

            try {
                const response = await fetch(apiTarget, options);
                const data = await response.json();

                // Si la API encuentra los datos exitosamente
                if (data && data.success && data.links && data.links.length > 0) {
                    mensaje.innerText = "✅ ¡Enlace obtenido con éxito!";
                    
                    // Buscamos el primer enlace de descarga que nos provea la API
                    const linkDirecto = data.links[0].link;
                    const calidad = data.links[0].quality || "Normal";
                    
                    videoTitulo.innerText = `Calidad encontrada: ${calidad}`;
                    btnDescarga.href = linkDirecto;
                    
                    // Mostramos la caja con el botón verde de descarga
                    resultadoBox.style.display = "block";
                } else {
                    mensaje.innerText = "❌ No se encontraron archivos descargables para este enlace. Revisa la URL.";
                }
            } catch (error) {
                console.error(error);
                mensaje.innerText = "❌ Hubo un error de comunicación con el servidor. Intenta de nuevo.";
            }
        }
    </script>
</body>
</html>
